apiVersion: apps/v1
kind: Deployment
metadata:
  name: herd-gateway-cpu
  labels:
    app: herd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: herd
  template:
    metadata:
      labels:
        app: herd
    spec:
      containers:
        - name: herd
          image: herd-cli:latest # Replace with your registry image path, e.g. username/herd-cli:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HERD_HOST
              value: "0.0.0.0"
            - name: HERD_PORT
              value: "11434"
            - name: HERD_HOME
              value: "/root/.herd"
          ports:
            - containerPort: 11434
              name: api
          volumeMounts:
            - name: model-cache
              mountPath: /root/.herd
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: herd-model-cache-pvc
