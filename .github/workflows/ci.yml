name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e .

      - name: Check Code Style (Ruff Lint)
        run: ruff check .

      - name: Verify Code Compilation
        run: python -m py_compile herd/cli.py herd/commands/*.py herd/services/*.py herd/core/*.py herd/api/*.py herd/api/routers/*.py

      - name: Run Pytest Suite
        run: pytest
