[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "herd-cli"
version = "0.1.0"
description = "A CLI and API gateway for running LLM and transcription models locally using llama.cpp and whisper.cpp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
herd = "herd.cli:main"
